# Drop-in do systemd para o bot-promo (complementa /etc/systemd/system/bot-promo.service).
# O deploy do CI (.github/workflows/ci.yml) instala este arquivo antes do daemon-reload.
# Instalacao manual, se precisar:
#   sudo install -D -m644 deploy/bot-promo.override.conf /etc/systemd/system/bot-promo.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart bot-promo
# Atencao: o systemd NAO aceita comentario no fim da linha; comente sempre em linha propria.
# TimeoutStopSec fica no padrao (90 s): cobre um envio de foto em andamento no stop.

[Unit]
Wants=network-online.target
After=network-online.target
# Nunca desistir de reiniciar (o padrao desiste apos 5 starts em 10 s).
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
# 78 = sessao do Telegram invalida (observable.py): reiniciar nao resolve, so login manual.
RestartPreventExitStatus=78
# SIGINT faz o Telethon desconectar salvando o estado usado pelo catch_up.
KillSignal=SIGINT
# Logs chegam ao journal na hora (sem buffer em blocos).
Environment=PYTHONUNBUFFERED=1
